<div class="flex flex-col gap-8">
  <h2 class="font-bold text-4xl">Servicios</h2>
  <div class="flex flex-row gap-4">
    <div class="flex flex-col gap-4">
      @for (service of services; track service.id) {
        <landing-section-service-option [option]="service" />
      }
    </div>

    <div class="flex flex-col gap-4">
      <landing-section-service-selected [service]="services[0]" />
    </div>
  </div>
</div>
