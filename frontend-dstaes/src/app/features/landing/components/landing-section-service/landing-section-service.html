<landing-wrapper title="Servicios">
  <div class="flex flex-row gap-4">
    <div class="flex flex-col gap-4">
      @for (service of services; track service.id) {
        <landing-section-service-option [option]="service" />
      }
    </div>

    <div class="flex flex-col gap-4">
      <landing-section-service-selected [service]="services[0]" />
    </div>
  </div>

  <div class="w-250">
    <landing-section-technology />
  </div>
</landing-wrapper>
