<ui-card>
  <div class="flex flex-col gap-4 p-4 w-300">
    <img [src]="service().image" alt="" class="w-full h-120 object-cover rounded-2xl" />
    <h3 class="font-semibold text-2xl">{{ service().title }}</h3>
    <p class="text-body">
      {{ service().description }}
    </p>
    <ui-button variant="default" size="md" href="/contact" class="w-full">
      Quiero contratar este servicio
    </ui-button>
  </div>
</ui-card>
